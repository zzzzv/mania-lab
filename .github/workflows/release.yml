name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - run: pnpm install --frozen-lockfile
    - run: pnpm run build

    - name: Get date tag
      id: date
      run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Create zip
      run: |
        cd dist
        zip -r ../mania-lab-${{ steps.date.outputs.tag }}.zip .

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ steps.date.outputs.tag }}"
        PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
        if [ -n "$PREV" ]; then
          RANGE="${PREV}..HEAD"
        else
          RANGE="HEAD"
        fi
        NOTES="$(git log "$RANGE" --format="- %s" --reverse)"
        if [ -z "$NOTES" ]; then
          NOTES="$(git log -1 --format=%s)"
        fi
        gh release create "$TAG" "mania-lab-${TAG}.zip" --title "$TAG" --notes "$NOTES"
